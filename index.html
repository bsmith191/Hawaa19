<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Badges - Premium Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }

        .trust-badges-section {
            background: #FFFFFF;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .trust-badges-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            max-width: 900px;
            margin: 0 auto;
        }

        .trust-badge-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-width: 0;
        }

        /* Item 1 - Made in India */
        .indian-flag {
            width: 48px;
            height: 32px;
            position: relative;
            margin-bottom: 12px;
        }

        .flag-stripe {
            width: 100%;
            height: 33.33%;
        }

        .flag-saffron {
            background: #FF9933;
            border-radius: 2px 2px 0 0;
        }

        .flag-white {
            background: #FFFFFF;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid #e0e0e0;
            border-right: 1px solid #e0e0e0;
        }

        .flag-green {
            background: #138808;
            border-radius: 0 0 2px 2px;
        }

        .ashoka-chakra {
            width: 14px;
            height: 14px;
            border: 1.5px solid #000080;
            border-radius: 50%;
            position: relative;
        }

        .chakra-spoke {
            position: absolute;
            width: 1px;
            height: 100%;
            background: #000080;
            left: 50%;
            top: 0;
            transform-origin: center;
        }

        .chakra-spoke:nth-child(1) { transform: translateX(-50%) rotate(0deg); }
        .chakra-spoke:nth-child(2) { transform: translateX(-50%) rotate(15deg); }
        .chakra-spoke:nth-child(3) { transform: translateX(-50%) rotate(30deg); }
        .chakra-spoke:nth-child(4) { transform: translateX(-50%) rotate(45deg); }
        .chakra-spoke:nth-child(5) { transform: translateX(-50%) rotate(60deg); }
        .chakra-spoke:nth-child(6) { transform: translateX(-50%) rotate(75deg); }
        .chakra-spoke:nth-child(7) { transform: translateX(-50%) rotate(90deg); }
        .chakra-spoke:nth-child(8) { transform: translateX(-50%) rotate(105deg); }
        .chakra-spoke:nth-child(9) { transform: translateX(-50%) rotate(120deg); }
        .chakra-spoke:nth-child(10) { transform: translateX(-50%) rotate(135deg); }
        .chakra-spoke:nth-child(11) { transform: translateX(-50%) rotate(150deg); }
        .chakra-spoke:nth-child(12) { transform: translateX(-50%) rotate(165deg); }

        /* Item 2 - Rating */
        .rating-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-bottom: 12px;
        }

        .rating-number {
            font-size: 42px;
            font-weight: 600;
            color: #000000;
            line-height: 1;
        }

        .star-icon {
            font-size: 42px;
            color: #FFD700;
            line-height: 1;
        }

        /* Item 3 - Warranty */
        .warranty-display {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 4px;
            margin-bottom: 12px;
        }

        .warranty-number {
            font-size: 42px;
            font-weight: 600;
            color: #6B4CE6;
            line-height: 1;
        }

        .warranty-unit {
            font-size: 24px;
            font-weight: 500;
            color: #000000;
            line-height: 1;
        }

        /* Label text */
        .badge-label {
            font-size: 14px;
            font-weight: 400;
            color: #000000;
            letter-spacing: 0.3px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .trust-badges-section {
                padding: 32px 16px;
            }

            .trust-badges-container {
                gap: 40px;
            }

            .indian-flag {
                width: 40px;
                height: 27px;
            }

            .ashoka-chakra {
                width: 12px;
                height: 12px;
            }

            .rating-number,
            .warranty-number {
                font-size: 36px;
            }

            .warranty-unit {
                font-size: 20px;
            }

            .badge-label {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .trust-badges-section {
                padding: 28px 12px;
            }

            .trust-badges-container {
                gap: 24px;
            }

            .indian-flag {
                width: 36px;
                height: 24px;
                margin-bottom: 10px;
            }

            .ashoka-chakra {
                width: 11px;
                height: 11px;
                border-width: 1.3px;
            }

            .rating-display,
            .warranty-display {
                margin-bottom: 10px;
            }

            .rating-number,
            .warranty-number {
                font-size: 32px;
            }

            .star-icon {
                font-size: 32px;
            }

            .warranty-unit {
                font-size: 18px;
            }

            .badge-label {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="trust-badges-section">
        <div class="trust-badges-container">
            <!-- Item 1: Made in India -->
            <div class="trust-badge-item">
                <div class="indian-flag">
                    <div class="flag-stripe flag-saffron"></div>
                    <div class="flag-stripe flag-white">
                        <div class="ashoka-chakra">
                            <div class="chakra-spoke"></div>
                            <div class="chakra-spoke"></div>
                            <div class="chakra-spoke"></div>
                            <div class="chakra-spoke"></div>
                            <div class="chakra-spoke"></div>
                            <div class="chakra-spoke"></div>
                            <div class="chakra-spoke"></div>
                            <div class="chakra-spoke"></div>
                            <div class="chakra-spoke"></div>
                            <div class="chakra-spoke"></div>
                            <div class="chakra-spoke"></div>
                            <div class="chakra-spoke"></div>
                        </div>
                    </div>
                    <div class="flag-stripe flag-green"></div>
                </div>
                <p class="badge-label">Made in India</p>
            </div>

            <!-- Item 2: Rating -->
            <div class="trust-badge-item">
                <div class="rating-display">
                    <span class="rating-number">5</span>
                    <span class="star-icon">★</span>
                </div>
                <p class="badge-label">Highly Rated</p>
            </div>

            <!-- Item 3: Warranty -->
            <div class="trust-badge-item">
                <div class="warranty-display">
                    <span class="warranty-number">1</span>
                    <span class="warranty-unit">Yr</span>
                </div>
                <p class="badge-label">PAN India Warranty</p>
            </div>
        </div>
    </div>
</body>
</html>
