<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawaa | Pure Air</title>
    <style>
        /* CORE RESET & FONTS */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; }
        body { background-color: #000; color: #fff; overflow-x: hidden; }

        /* 1. TESLA-STYLE HEADER */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: transparent; /* Crystal clear to show video */
        }

        .brand-logo {
            font-size: 20px;
            font-weight: 500; /* Medium weight, NOT bold */
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
            text-decoration: none;
            opacity: 0.95;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5); /* Improves visibility over video */
        }

        .menu-btn {
            background: rgba(0, 0, 0, 0.2); /* Subtle backing */
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }
        .menu-btn:hover { background: rgba(255, 255, 255, 0.2); }

        /* 2. HERO SECTION (Video Background) */
        .hero {
            height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            padding-top: 18vh; /* Similar spacing to Tesla */
            text-align: center;
        }

        /* The Background Video/Image */
        .video-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
            /* Slight dim to ensure text pops, but video remains clear */
            filter: brightness(0.8); 
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        .hero p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
        }
        .btn {
            padding: 12px 60px; /* Wide buttons like Tesla */
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.02); }
        .btn-primary { background: #3e6ae1; color: white; } /* Tesla Blue */
        .btn-secondary { background: #fff; color: #000; }

        /* 3. 3D BENTO GRID DASHBOARD */
        .dashboard-section {
            padding: 100px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 32px;
            margin-bottom: 40px;
            padding-left: 10px;
            font-weight: 500;
        }

        /* The Grid Layout */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 Columns */
            grid-template-rows: repeat(2, 320px); /* 2 Rows, fixed height */
            gap: 20px;
        }

        /* Grid Items (Cards) */
        .grid-item {
            background: #111;
            border-radius: 24px; /* Smooth rounded corners */
            overflow: hidden;
            position: relative;
            border: 1px solid #222;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .grid-item:hover { 
            transform: translateY(-5px); 
            border-color: #444; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Text inside cards */
        .card-content {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 2;
        }
        .card-title { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
        .card-desc { font-size: 15px; color: #aaa; font-weight: 400; }

        /* SPECIFIC CARD STYLING */
        
        /* 1. Main Product Image (Tall Left Card) */
        .item-main {
            grid-column: span 1;
            grid-row: span 2;
            background: #f0f0eb; /* Matches the beige tone of your device */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .item-main img {
            width: 85%;
            height: auto;
            max-height: 80%;
            object-fit: contain;
            /* Drop shadow to make it look 3D standing in the box */
            filter: drop-shadow(0 30px 40px rgba(0,0,0,0.25));
            transition: transform 0.5s ease;
        }
        .item-main:hover img { transform: scale(1.05); }

        /* 2. Feature Cards */
        .item-wide { grid-column: span 2; } /* Spans 2 columns */
        
        /* Gradients */
        .bg-gradient-1 { background: linear-gradient(145deg, #1e1e1e, #0d0d0d); }
        .bg-gradient-2 { background: linear-gradient(145deg, #252525, #151515); }
        
        /* Typography for stats */
        .center-stat {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }
        .stat-number { font-size: 56px; font-weight: 700; color: #fff; letter-spacing: -1px; }
        .stat-unit { font-size: 16px; color: #888; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px;}

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .hero h1 { font-size: 34px; }
            .hero p { font-size: 16px; }
            .hero-buttons { flex-direction: column; width: 100%; padding: 0 40px; }
            .btn { width: 100%; }
            
            /* Stack the grid on mobile */
            .bento-grid {
                grid-template-columns: 1fr; 
                grid-template-rows: auto;
            }
            /* Product image first on mobile */
            .item-main { grid-column: span 1; height: 450px; order: -1; }
            .item-wide { grid-column: span 1; height: 280px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand-logo">Hawaa</a>
        
        <div class="menu-btn">Menu</div>
    </header>

    <section class="hero">
        <img src="https://images.unsplash.com/photo-1542223616-9de78165cccd?q=80&w=3274&auto=format&fit=crop" class="video-bg" alt="Hawaa Background">
        
        <h1>Pure Air (Supervised)</h1>
        <p>One-time purchase for a lifetime of health.</p>
        
        <div class="hero-buttons">
            <button class="btn btn-primary">Order Now</button>
            <button class="btn btn-secondary">Learn More</button>
        </div>
    </section>

    <section class="dashboard-section">
        <h2 class="section-title">Engineered for India</h2>
        
        <div class="bento-grid">
            
            <div class="grid-item item-main">
                <img src="purifier.PNG" alt="Hawaa Purifier">
            </div>

            <div class="grid-item item-wide bg-gradient-1 center-stat">
                <div class="stat-number">99.97%</div>
                <div class="stat-unit">Particle Removal (PM 2.5)</div>
                <div class="card-content">
                    <div class="card-title" style="font-size: 18px; margin-bottom: 0;">True HEPA H13</div>
                </div>
            </div>

            <div class="grid-item bg-gradient-2">
                <div class="card-content">
                    <div class="card-title">24dB</div>
                    <div class="card-desc">Whisper quiet sleep mode.</div>
                </div>
            </div>

            <div class="grid-item bg-gradient-2">
                <div class="card-content">
                    <div class="card-title">450 sq.ft</div>
                    <div class="card-desc">Clean air in 12 mins.</div>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
